<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dardidog | Site en maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f7f1e3;
      font-family: 'Open Sans', Tahoma, sans-serif;
      color: #154734;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin-bottom: 16px;
    }

    .brand {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #154734;
      line-height: 1;
      margin-bottom: 32px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 48px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(21, 71, 52, 0.1);
      border: 1px solid rgba(21, 71, 52, 0.1);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #154734;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #3a5a4a;
      margin-bottom: 12px;
    }

    .contact {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(21, 71, 52, 0.15);
      font-size: 0.9rem;
      color: #154734;
    }

    .contact a {
      color: #154734;
      font-weight: 600;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #154734;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .social a:hover {
      background: rgba(21, 71, 52, 0.08);
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .brand { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <img src="images/favicon.svg" alt="Logo Dardidog" class="logo">
  <div class="brand">Dardidog</div>

  <div class="card">
    <div class="icon">🐾</div>
    <h1>Ouverture au 1er mai !</h1>
   
   
    </div>
  </div>

  <!-- GoatCounter Analytics -->
  <script data-goatcounter="https://jerodelo.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

</body>
</html>
