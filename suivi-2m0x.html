<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dardidog</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="manifest" href="gestion.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content=" ">
<link rel="apple-touch-icon" sizes="180x180" href="images/logo_180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap"></noscript>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block"></noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #214B36;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: #ddd6c8;
    border: 1px solid #ddd6c8;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    text-align: center;
  }
  .logo { width: 72px; height: 72px; border-radius: 50%; object-fit: contain; margin-bottom: 20px; }
  h1 { font-family: 'Great Vibes', cursive; font-size: 2.6rem; color: #154734; margin-bottom: 6px; }
  .subtitle { font-size: 0.85rem; color: #4a6355; margin-bottom: 28px; }
  .input-wrap { position: relative; margin-bottom: 12px; }
  input[type=password], input[type=text] {
    width: 100%; border: 1.5px solid #ddd6c8; border-radius: 10px;
    padding: 13px 44px 13px 16px; font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; color: #2d3b2f; background: #faf7f2;
    transition: border-color 0.2s; -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: #154734; }
  .toggle-pwd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: #4a6355; padding: 4px;
  }
  .btn-primary {
    width: 100%; background: #154734; color: #fff; border: none; border-radius: 10px;
    padding: 13px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; margin-top: 4px; transition: background 0.2s;
  }
  .btn-primary:hover { background: #0f3326; }
  .error {
    display: none; margin-top: 14px; background: #fdecea; color: #c0392b;
    border: 1px solid #f5c6c2; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="card">
  <img src="images/logo_192.png" alt="Dardidog" class="logo">
  <h1>Dardidog</h1>
  <p class="subtitle">Espace de gestion</p>
  <form onsubmit="verifier(event)">
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password">
      <button type="button" class="toggle-pwd" onclick="toggleVoir()" tabindex="-1" aria-label="Afficher">
        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <button type="submit" class="btn-primary">Accéder</button>
    <div class="error" id="error">Mot de passe incorrect.</div>
  </form>
</div>

<script>
  const HASH = "011f54769a84df84fa93592ad88ae09f9ab3d6faa8dcda8f169865a098abdc73";

  async function verifier(e) {
    e.preventDefault();
    const pwd = document.getElementById('pwd').value;
    if (!pwd) return;
    const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pwd));
    const hex  = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    if (hex === HASH) {
      localStorage.setItem('dardidog_auth', '1');
      window.location.replace('gestion.html');
    } else {
      document.getElementById('error').style.display = 'block';
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  }

  function toggleVoir() {
    const input = document.getElementById('pwd');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  setTimeout(() => document.getElementById('pwd').focus(), 100);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
